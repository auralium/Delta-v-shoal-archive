#legionalis hardsuit
- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetBattlecarapacemk1
  name: battle carapace mk1 helmet
  description: Armored hardsuit helmet for security needs.
  components:
  - type: Sprite
    sprite: _TheShoal/Clothing/Head/Hardsuits/battlecarapacemk1helm.rsi
  - type: Clothing
    sprite: _TheShoal/Clothing/Head/Hardsuits/battlecarapacemk1helm.rsi
  - type: PointLight
    color: "#ffadf4"
  - type: PressureProtection
    highPressureMultiplier: 0.525
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: Tag
    tags:
    - CorgiWearable
    - WhitelistChameleon
